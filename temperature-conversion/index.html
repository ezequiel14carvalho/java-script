<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <h1>Temperature Conversion</h1>
        <input value="0" type="number" id="tempareture"><br>

        <input type="radio" id="celsius" name="unit">
        <label for="celsius">Celsius to Fahrenheit</label><br>
        
        <input type="radio" id="fahrenheit" name="unit">
        <label for="fahrenheit">Fahrenheit to Celsius</label><br>

        <button onclick="convert()" type="button">Convert</button>
        <p id="result"></p>
    </form>

    <script src="index.js"></script>
</body>
</html>
